<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alicante Digital - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = {
darkMode: "class",
theme: {
extend: {
colors: {
primary: "#1193d4",
"background-light": "#f6f7f8",
"background-dark": "#101c22",
},
fontFamily: {
display: ["Public Sans"]
}
}
}
};
</script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">

<div class="flex flex-col min-h-screen">

<!-- HEADER (EL TUYO) -->
<header class="bg-background-light dark:bg-background-dark border-b border-black/10 sticky top-0 z-10">
<div class="container mx-auto px-6 h-16 flex items-center justify-between">

<a href="/" class="text-primary font-bold text-xl">
Alicante Digital
</a>

</div>
</header>

<!-- DASHBOARD -->
<main class="container mx-auto px-6 py-10">

<h1 class="text-4xl font-bold mb-10 text-slate-900 dark:text-white">
Dashboard Provincial de Digitalización
</h1>

<!-- MEDIA PROVINCIAL -->
<div class="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow mb-10 text-center">
<p class="text-slate-500 mb-2">Media de digitalización provincial</p>
<p id="mediaDigital" class="text-6xl font-bold text-primary">--%</p>
</div>

<!-- GRID -->
<div class="grid lg:grid-cols-2 gap-10">

<!-- RANKING -->
<div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow">
<h2 class="font-bold mb-4 text-lg">Top Ayuntamientos</h2>
<canvas id="rankingChart"></canvas>
</div>

<!-- DISTRIBUCION -->
<div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow">
<h2 class="font-bold mb-4 text-lg">Madurez Digital</h2>
<canvas id="madurezChart"></canvas>
</div>

<!-- RADAR -->
<div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow">
<h2 class="font-bold mb-4 text-lg">Media por Áreas</h2>
<canvas id="radarChart"></canvas>
</div>

<!-- ZONAS -->
<div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow">
<h2 class="font-bold mb-4 text-lg">Digitalización por Zonas</h2>
<canvas id="zonasChart"></canvas>
</div>

</div>
</main>
</div>

<!-- SCRIPTS -->
<script>

// MEDIA
fetch("/api/media-digitalizacion")
.then(r=>r.json())
.then(d=>{
document.getElementById("mediaDigital").innerText = d.media + "%";
});


// RANKING
fetch("/api/ranking")
.then(r=>r.json())
.then(data=>{

new Chart(document.getElementById('rankingChart'), {
type:'bar',
data:{
labels:data.map(a=>a.nombre),
datasets:[{
label:"% Digitalización",
data:data.map(a=>a.valor)
}]
},
options:{
indexAxis:'y'
}
});

});


// DISTRIBUCION
fetch("/api/distribucion")
.then(r=>r.json())
.then(d=>{

new Chart(document.getElementById('madurezChart'),{
type:'doughnut',
data:{
labels:Object.keys(d),
datasets:[{
data:Object.values(d)
}]
}
});

});


// RADAR
fetch("/api/media-areas")
.then(r=>r.json())
.then(d=>{

new Chart(document.getElementById('radarChart'),{
type:'radar',
data:{
labels:Object.keys(d),
datasets:[{
label:"Media",
data:Object.values(d)
}]
}
});

});


// ZONAS
fetch("/api/zonas")
.then(r=>r.json())
.then(data=>{

new Chart(document.getElementById('zonasChart'),{
type:'doughnut',
data:{
labels:data.labels,
datasets:[{
data:data.valores
}]
}
});

});

</script>

</body>
</html>
