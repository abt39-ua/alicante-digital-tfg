<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alicante Digital</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#1193d4",
          "background-light": "#f6f7f8",
          "background-dark": "#101c22",
        },
        fontFamily: {
          "display": ["Public Sans"]
        },
        borderRadius: {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        },
      },
    },
    plugins: []
  };
</script>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
</style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex flex-col min-h-screen">

<header class="bg-background-light dark:bg-background-dark/80 backdrop-blur-sm sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-3 text-primary">
          <svg class="h-8 w-8" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path clip-rule="evenodd" d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z" fill="currentColor" fill-rule="evenodd"/>
            <path clip-rule="evenodd" d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z" fill="currentColor" fill-rule="evenodd"/>
          </svg>
          <h2 class="text-xl font-bold">Alicante Digital</h2>
        </div>
      </div>

      <a href="/login">
        <div class="rounded-full size-10 bg-primary/20 hover:opacity-80 transition"></div>
      </a>
    </div>
  </div>
</header>

<main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="max-w-7xl mx-auto">

<div class="text-center mb-12">
  <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Digitalización Municipal de Alicante</h1>
  <p class="text-lg text-gray-600 dark:text-gray-400 max-w-3xl mx-auto">
    Explora el progreso de la transformación digital de los ayuntamientos de Alicante.
  </p>
</div>

<!-- 🔵 NUEVO GRÁFICO CIRCULAR -->
<div class="bg-white dark:bg-background-dark rounded-xl p-6 shadow-md mb-12">
  <h2 class="text-2xl font-bold text-center mb-6">
    Digitalización por Zonas de la Provincia
  </h2>
  <div class="max-w-xl mx-auto">
    <canvas id="zonasChart"></canvas>
  </div>
</div>

</div>
</main>
</div>

<script>
fetch("/api/digitalizacion-zonas")
  .then(res => res.json())
  .then(data => {
    const ctx = document.getElementById("zonasChart");

    const labels = data.map(d => d.zona);
    const values = data.map(d => d.media);
    const aytos = data.map(d => d.ayuntamientos.join(", "));

    new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: [
            "#1193d4",
            "#34d399",
            "#fbbf24",
            "#f87171",
            "#a78bfa"
          ]
        }]
      },
      options: {
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const i = context.dataIndex;
                return [
                  `Media: ${values[i]}%`,
                  `Ayuntamientos: ${aytos[i]}`
                ];
              }
            }
          }
        }
      }
    });
  });
</script>

</body>
</html>
